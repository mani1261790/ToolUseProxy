name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  release-candidate:
    name: Reproducible release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.txt

      - name: Check CI supply-chain contract
        run: python scripts/check_ci_supply_chain.py

      - name: Install hash-locked build toolchain
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements/build.txt

      - name: Check build toolchain contract
        run: python scripts/check_build_toolchain.py

      - name: Build candidate from clean source
        run: >-
          python scripts/build_release_candidate.py
          --outdir "${RUNNER_TEMP}/tooluseproxy-release-candidate"
          --require-clean

      - name: Verify complete candidate offline
        run: >-
          python scripts/build_release_candidate.py
          --verify "${RUNNER_TEMP}/tooluseproxy-release-candidate"

  quality:
    name: Python ${{ matrix.python-version }} quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.txt

      - name: Audit public source and reachable Git history
        if: matrix.python-version == '3.11'
        run: python scripts/audit_public_source.py --require-clean

      - name: Install package and development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/build.txt
          python -m pip install ".[dev]"

      - name: Check build toolchain contract
        run: python scripts/check_build_toolchain.py

      - name: Run Ruff
        run: >-
          python -m ruff check
          tooluseproxy/engine tooluseproxy/app.py tooluseproxy/paths.py
          tooluseproxy/log_viewer.py tooluseproxy/viewer_process.py
          tooluseproxy/authority_state.py tooluseproxy/authority_admin.py
          tooluseproxy/integrations/authority.py tooluseproxy/integrations/activation.py
          tooluseproxy_hook_watchdog.py tooluseproxy_plugin.py build_support.py
          scripts/runtime_manifest.py scripts/build_package.py scripts/build_plugin_bundle.py
          tests/test_product_v2.py tests/test_semantic_flow.py tests/test_hook_watchdog.py
          tests/test_package_artifact.py tests/test_plugin_artifact.py
          tests/test_authority_state.py tests/test_authority_admin.py tests/test_logs_product.py

      - name: Run v0.2 product contract suite
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q hook_monitor tooluseproxy scripts tests

  macos-package-smoke:
    name: macOS Python 3.12 package smoke
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.txt

      - name: Install package and development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/build.txt
          python -m pip install ".[dev]"

      - name: Check build toolchain contract
        run: python scripts/check_build_toolchain.py

      - name: Build and install clean artifacts outside the checkout
        run: >-
          python -m pytest -q
          tests/test_package_artifact.py
          tests/test_plugin_artifact.py
          tests/test_product_v2.py
