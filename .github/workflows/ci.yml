name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.11 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel
          python -m pip install ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run full test suite
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q hook_monitor tooluseproxy scripts tests

      - name: Check full and incremental similarity parity
        run: >-
          python -m hook_monitor.evaluation.cli
          --split all
          --benchmark-repeats 1
          --format text
          --check

      - name: Check source-ingestion runtime parity
        run: >-
          python -m hook_monitor.evaluation.source_ingestion_cli
          --dataset tests/fixtures/similarity/ingestion/v3
          --split all
          --format text
          --check
