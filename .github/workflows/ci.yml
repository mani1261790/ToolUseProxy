name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  release-candidate:
    name: Reproducible release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.txt

      - name: Check CI supply-chain contract
        run: python scripts/check_ci_supply_chain.py

      - name: Install hash-locked build toolchain
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements/build.txt

      - name: Check build toolchain contract
        run: python scripts/check_build_toolchain.py

      - name: Build candidate from clean source
        run: >-
          python scripts/build_release_candidate.py
          --outdir "${RUNNER_TEMP}/tooluseproxy-release-candidate"
          --require-clean

      - name: Verify complete candidate offline
        run: >-
          python scripts/build_release_candidate.py
          --verify "${RUNNER_TEMP}/tooluseproxy-release-candidate"

  quality:
    name: Python ${{ matrix.python-version }} quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.txt

      - name: Audit public source and reachable Git history
        if: matrix.python-version == '3.11'
        run: python scripts/audit_public_source.py --require-clean

      - name: Install package and development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/build.txt
          python -m pip install ".[dev]"

      - name: Check build toolchain contract
        run: python scripts/check_build_toolchain.py

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run full test suite
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q hook_monitor tooluseproxy scripts tests

      - name: Check similarity development contract
        run: >-
          python -m hook_monitor.evaluation.cli
          --split development
          --benchmark-repeats 1
          --format text
          --check
          --require-go

      - name: Check similarity validation contract
        run: >-
          python -m hook_monitor.evaluation.cli
          --split validation
          --benchmark-repeats 1
          --format text
          --check
          --require-go

      - name: Check complete similarity contract
        run: >-
          python -m hook_monitor.evaluation.cli
          --split all
          --benchmark-repeats 1
          --format text
          --check
          --require-go

      - name: Check similarity v2.1 stress foundation
        run: |
          for split in development validation all; do
            python -m hook_monitor.evaluation.cli \
              --dataset tests/fixtures/similarity/v2_1 \
              --split "${split}" \
              --benchmark-repeats 1 \
              --format text \
              --check \
              --require-go
          done

      - name: Check reproducible similarity v2.1 fixture
        run: python -m scripts.build_similarity_v21_fixture --check

      - name: Check source-ingestion runtime parity
        run: >-
          python -m hook_monitor.evaluation.source_ingestion_cli
          --dataset tests/fixtures/similarity/ingestion/v3
          --split all
          --format text
          --check

      - name: Check sink-first benchmark foundation
        run: |
          for dataset in v1 v1_1; do
            python -m hook_monitor.evaluation.sink_benchmark_cli \
              --dataset "tests/fixtures/sink_benchmark/${dataset}" \
              --split all \
              --format text \
              --check
          done

      - name: Check protected-source discovery development gate
        run: >-
          python -m hook_monitor.evaluation.protected_source_discovery_cli
          --dataset tests/fixtures/protected_source_discovery/v2
          --split development
          --format text
          --check
          --require-go

      - name: Check protected-source discovery validation gate
        run: >-
          python -m hook_monitor.evaluation.protected_source_discovery_cli
          --dataset tests/fixtures/protected_source_discovery/v2
          --split validation
          --format text
          --check
          --require-go

      - name: Check protected-source discovery complete gate
        run: >-
          python -m hook_monitor.evaluation.protected_source_discovery_cli
          --dataset tests/fixtures/protected_source_discovery/v2
          --split all
          --format text
          --check
          --require-go

  macos-package-smoke:
    name: macOS Python 3.12 package smoke
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build.txt

      - name: Install package and development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/build.txt
          python -m pip install ".[dev]"

      - name: Check build toolchain contract
        run: python scripts/check_build_toolchain.py

      - name: Build and install clean artifacts outside the checkout
        run: >-
          python -m pytest -q
          tests/test_package_artifact.py
          tests/test_plugin_artifact.py
          tests/test_productization.py::WheelInstallationTest
