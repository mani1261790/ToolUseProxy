name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  release-candidate:
    name: Reproducible release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install artifact build dependency
        run: python -m pip install --upgrade pip build "setuptools>=77" wheel

      - name: Build candidate from clean source
        run: >-
          python scripts/build_release_candidate.py
          --outdir "${RUNNER_TEMP}/tooluseproxy-release-candidate"
          --require-clean

      - name: Verify complete candidate offline
        run: >-
          python scripts/build_release_candidate.py
          --verify "${RUNNER_TEMP}/tooluseproxy-release-candidate"

  quality:
    name: Python ${{ matrix.python-version }} quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel
          python -m pip install ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run full test suite
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q hook_monitor tooluseproxy scripts tests

      - name: Check similarity development contract
        run: >-
          python -m hook_monitor.evaluation.cli
          --split development
          --benchmark-repeats 1
          --format text
          --check
          --require-go

      - name: Check similarity validation contract
        run: >-
          python -m hook_monitor.evaluation.cli
          --split validation
          --benchmark-repeats 1
          --format text
          --check
          --require-go

      - name: Check complete similarity contract
        run: >-
          python -m hook_monitor.evaluation.cli
          --split all
          --benchmark-repeats 1
          --format text
          --check
          --require-go

      - name: Check source-ingestion runtime parity
        run: >-
          python -m hook_monitor.evaluation.source_ingestion_cli
          --dataset tests/fixtures/similarity/ingestion/v3
          --split all
          --format text
          --check

      - name: Check protected-source discovery development gate
        run: >-
          python -m hook_monitor.evaluation.protected_source_discovery_cli
          --dataset tests/fixtures/protected_source_discovery/v2
          --split development
          --format text
          --check
          --require-go

      - name: Check protected-source discovery validation gate
        run: >-
          python -m hook_monitor.evaluation.protected_source_discovery_cli
          --dataset tests/fixtures/protected_source_discovery/v2
          --split validation
          --format text
          --check
          --require-go

      - name: Check protected-source discovery complete gate
        run: >-
          python -m hook_monitor.evaluation.protected_source_discovery_cli
          --dataset tests/fixtures/protected_source_discovery/v2
          --split all
          --format text
          --check
          --require-go

  macos-package-smoke:
    name: macOS Python 3.12 package smoke
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel
          python -m pip install ".[dev]"

      - name: Build and install clean artifacts outside the checkout
        run: >-
          python -m pytest -q
          tests/test_package_artifact.py
          tests/test_plugin_artifact.py
          tests/test_productization.py::WheelInstallationTest
