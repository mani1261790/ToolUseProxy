[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tooluseproxy"
dynamic = ["version"]
description = "Local information-flow guardrails for Codex tool use"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "ToolUseProxy contributors" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
tooluseproxy = "tooluseproxy.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tooluseproxy.__version__" }

[tool.setuptools.packages.find]
include = ["hook_monitor*", "tooluseproxy*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
