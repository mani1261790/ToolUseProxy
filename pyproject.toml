[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tooluseproxy"
dynamic = ["version"]
description = "Local information-flow guardrails for Codex tool use"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [
  { name = "ToolUseProxy contributors" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff==0.15.22",
]

[project.scripts]
tooluseproxy = "tooluseproxy.app:main"

[tool.setuptools.dynamic]
version = { attr = "tooluseproxy.__version__" }

[tool.setuptools.packages.find]
include = ["tooluseproxy", "tooluseproxy.engine", "tooluseproxy.integrations"]
exclude = ["hook_monitor.evaluation*"]

[tool.setuptools.package-data]
tooluseproxy = ["viewer/*.html", "viewer/*.js", "viewer/*.css"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = [
  "tests/test_product_v2.py",
  "tests/test_property_graph.py",
  "tests/test_evidence.py",
  "tests/test_payload.py",
  "tests/test_dlp.py",
  "tests/test_legacy_archive.py",
  "tests/test_semantic_flow.py",
  "tests/test_hook_watchdog.py",
  "tests/test_package_artifact.py",
  "tests/test_plugin_artifact.py",
  "tests/test_authority_state.py",
  "tests/test_authority_admin.py",
  "tests/test_logs_product.py",
]

[tool.setuptools.cmdclass]
build_py = "build_support.RuntimeBuildPy"
