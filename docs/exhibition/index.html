<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ToolUseProxy · ログ</title><link rel="stylesheet" href="screen.css"><script src="screen.js" defer></script></head>
<body>
<header class="appbar">
<h1>ToolUseProxy<span class="wordmark-detail">ログ</span></h1>
<div class="header-actions"><span id="connection" role="status">接続中…</span><button id="display-settings" type="button" aria-haspopup="dialog">表示・絞り込み<span id="filter-count" hidden></span></button></div>
</header>
<dialog id="settings-dialog" aria-labelledby="settings-title">
<div class="dialog-header"><h2 id="settings-title">表示・絞り込み</h2><button id="close-settings" type="button" aria-label="閉じる">閉じる</button></div>
<form class="filters" aria-label="ログの絞り込み">
<label>プロジェクト<select id="workspace"><option value="">すべてのプロジェクト</option></select></label>
<label>セッション<select id="session"><option value="">すべてのセッション</option></select></label>
<label class="check-option"><input type="checkbox" id="blocked-only"> ブロック判定のみ</label>
<label class="check-option"><input type="checkbox" id="follow" checked> 新しい呼び出しを追う</label>
</form>
<p id="scope-note" class="hint" hidden></p>
<p class="hint">変更はすぐに反映されます。選択した条件内の最新300イベントを表示します。</p>
<details class="source"><summary>接続先DB</summary><span id="database">events.db</span><p class="hint">読み取り専用。ToolUseProxyが無効の間は記録は増えません。</p></details>
</dialog>
<main>
<section class="calls"><div class="list-heading"><h2>呼び出し<span id="count"></span></h2></div><div id="calls"></div></section>
<section class="detail"><h2 id="title">呼び出しを選択</h2><p id="identity" class="hint"></p><div id="decisions"></div><div id="io"><p class="empty">ToolUseProxyの記録を待っています。</p></div></section>
</main>
<footer><span id="active-scope">すべての呼び出し</span><span id="updated"></span></footer>
</body></html>
