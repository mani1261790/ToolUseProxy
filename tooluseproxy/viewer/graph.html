<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ToolUseProxy · 来歴</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="screen.css"><link rel="stylesheet" href="graph.css"><script src="graph.js" defer></script></head><body><header class="appbar"><h1>ToolUseProxy</h1><nav class="view-nav" aria-label="表示画面"><a id="log-link" href="index.html">ログ</a><a id="graph-link" href="graph.html" aria-current="page">グラフ</a></nav><div class="header-actions"><span id="connection" role="status">接続しています…</span></div></header><main>

</section>
</main>
<footer><span id="view-mode">最新の呼び出しの来歴</span><span id="updated"></span></footer>
